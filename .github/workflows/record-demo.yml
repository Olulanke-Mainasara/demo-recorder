name: Record demo

on:
  workflow_dispatch:
    inputs:
      project:
        description: Which walkthrough to run (record-<project>-demo.mjs)
        type: choice
        # Add a project here when you add its record-<project>-demo.mjs
        options:
          - mevire
          - evolve
          - arepo
        default: mevire
      url:
        description: Site URL (leave blank to use the one in the project's script)
        required: false
        default: ""
      frame:
        description: Mac window frame (1920×1080, on a random landscape photo). Untick for the plain 1440×900 recording.
        type: boolean
        default: true

jobs:
  record:
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ inputs.project }}
      DEMO_URL: ${{ inputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Install Remotion's browser
        if: ${{ inputs.frame }}
        run: npx remotion browser ensure

      - name: Install ffmpeg
        if: ${{ !inputs.frame }}
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Record walkthrough
        run: node "record-${PROJECT}-demo.mjs"

      # Every video must be 1:30 or shorter. The scripts are timed to finish
      # around 1:20; both steps below cut at 1:30 only as a backstop.
      - name: Frame it in a Mac window with Remotion (max 1:30)
        if: ${{ inputs.frame }}
        run: node render.mjs "videos/${PROJECT}-demo.mp4"

      - name: Trim loading frames and convert to MP4 (max 1:30)
        if: ${{ !inputs.frame }}
        run: |
          OFFSET=$(node -p "require('./videos/meta.json').trimStart")
          ffmpeg -y -ss "$OFFSET" -i videos/raw.webm -t 90 \
            -c:v libx264 -preset veryfast -crf 18 \
            -pix_fmt yuv420p -movflags +faststart \
            "videos/${PROJECT}-demo.mp4"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project }}-demo
          path: videos/${{ inputs.project }}-demo.mp4
